name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: 'basic'
    - name: Determine application version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        read -r version base_version_code <<< "$(./gradlew -q :app:printVersionInfo)"
        if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
          echo "Unexpected application version: $version" >&2
          exit 1
        fi
        if [[ ! "$base_version_code" =~ ^[0-9]+$ ]]; then
          echo "Unexpected versionCode base: $base_version_code" >&2
          exit 1
        fi

        version_code=$((base_version_code + GITHUB_RUN_NUMBER))
        if (( version_code <= base_version_code || version_code > 2100000000 )); then
          echo "Generated versionCode is outside the supported range: $version_code" >&2
          exit 1
        fi

        {
          echo "name=$version"
          echo "code=$version_code"
        } >> "$GITHUB_OUTPUT"
    - name: Write release metadata
      env:
        VERSION_NAME: ${{ steps.version.outputs.name }}
        VERSION_CODE: ${{ steps.version.outputs.code }}
      shell: bash
      run: |
        set -euo pipefail
        printf '{"versionName":"%s","versionCode":%s}\n' "$VERSION_NAME" "$VERSION_CODE" > xtra-release-metadata.json
    - name: Run JVM tests
      run: ./gradlew testDebugUnitTest

    - name: Check resource localization hygiene
      run: python3 .github/scripts/check-resources.py

    - name: Run release lookup shell tests
      run: bash .github/scripts/test-release-lookup.sh

    - name: Build with Gradle
      run: ./gradlew assembleRelease "-PciVersionCode=${{ steps.version.outputs.code }}"

    - name: Verify release metadata against APK
      env:
        VERSION_NAME: ${{ steps.version.outputs.name }}
        VERSION_CODE: ${{ steps.version.outputs.code }}
      shell: bash
      run: |
        set -euo pipefail
        apk_asset=app/build/outputs/apk/release/app-release.apk
        metadata_asset=xtra-release-metadata.json
        if [[ ! -f "$apk_asset" ]]; then
          echo "Expected release APK is missing: $apk_asset" >&2
          exit 1
        fi
        if [[ ! -f "$metadata_asset" ]]; then
          echo "Release metadata is missing: $metadata_asset" >&2
          exit 1
        fi

        metadata_version_name="$(jq -er '.versionName | strings' "$metadata_asset")"
        metadata_version_code="$(jq -er '.versionCode | numbers | tostring' "$metadata_asset")"
        if [[ "$metadata_version_name" != "$VERSION_NAME" || "$metadata_version_code" != "$VERSION_CODE" ]]; then
          echo "Release metadata does not match the CI version outputs" >&2
          exit 1
        fi

        aapt2="$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt2 -print | sort -V | tail -n1)"
        if [[ -z "$aapt2" ]]; then
          echo "Could not locate aapt2 to inspect the release APK" >&2
          exit 1
        fi
        badging="$($aapt2 dump badging "$apk_asset")"
        package_line="$(grep -m1 '^package: ' <<< "$badging" || true)"
        apk_version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
        apk_version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
        if [[ -z "$apk_version_name" || -z "$apk_version_code" ]]; then
          echo "Could not read version identity from $apk_asset" >&2
          exit 1
        fi
        if [[ "$apk_version_name" != "$metadata_version_name" || "$apk_version_code" != "$metadata_version_code" ]]; then
          echo "Built APK identity does not match xtra-release-metadata.json" >&2
          echo "APK: versionName=$apk_version_name versionCode=$apk_version_code" >&2
          echo "Metadata: versionName=$metadata_version_name versionCode=$metadata_version_code" >&2
          exit 1
        fi
        echo "Verified release APK versionName=$apk_version_name versionCode=$apk_version_code"

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: apk
        path: app/build/outputs/apk/release/*.apk

    - name: Generate release notes
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        previous_tag="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
        previous_ref=""
        if [[ -n "$previous_tag" ]] && git fetch --no-tags origin "refs/tags/${previous_tag}" >/dev/null 2>&1; then
          previous_ref=FETCH_HEAD
        fi
        if [[ -n "$previous_ref" ]] && git rev-parse --verify "${previous_ref}^{commit}" >/dev/null 2>&1; then
          git log "${previous_ref}..HEAD" --oneline --decorate=no > notes.txt
        else
          git log --oneline --decorate=no > notes.txt
        fi

    - name: Validate release token
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      env:
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${RELEASE_TOKEN:-}" ]]; then
          echo "RELEASE_TOKEN repository secret is required for publishing releases" >&2
          exit 1
        fi

    - name: Create immutable build release
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        VERSION: ${{ steps.version.outputs.name }}
      shell: bash
      run: |
        set -euo pipefail
        tag="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
        repository_url="https://github.com/${GITHUB_REPOSITORY}.git"

        apk_asset=app/build/outputs/apk/release/app-release.apk
        metadata_asset=xtra-release-metadata.json
        if [[ ! -f "$apk_asset" ]]; then
          echo "No app-release.apk was produced" >&2
          exit 1
        fi
        if [[ ! -f "$metadata_asset" ]]; then
          echo "No release metadata was produced" >&2
          exit 1
        fi

        get_remote_tag_sha() {
          local refs
          if ! refs="$(git ls-remote origin "refs/tags/${tag}" "refs/tags/${tag}^{}")"; then
            echo "Unable to inspect remote release tag ${tag}" >&2
            return 1
          fi

          local resolved_sha=""
          while IFS=$'\t' read -r candidate_sha candidate_ref; do
            case "$candidate_ref" in
              "refs/tags/${tag}^{}")
                resolved_sha="$candidate_sha"
                break
                ;;
              "refs/tags/${tag}")
                if [[ -z "$resolved_sha" ]]; then
                  resolved_sha="$candidate_sha"
                fi
                ;;
            esac
          done <<< "$refs"
          printf '%s' "$resolved_sha"
        }

        verify_tag() {
          local resolved_sha
          resolved_sha="$(get_remote_tag_sha)"
          if [[ "$resolved_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag ${tag} resolves to ${resolved_sha:-<missing>}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi
        }

        source .github/scripts/release-lookup.sh

        asset_count() {
          jq -r --arg name "$1" '[.assets[] | select(.name == $name)] | length' <<< "$release_json"
        }

        ensure_asset_present() {
          local name="$1"
          local path="$2"
          local count
          refresh_release
          count="$(asset_count "$name")"
          if [[ "$count" != 0 && "$count" != 1 ]]; then
            echo "Release ${tag} contains multiple assets named ${name}" >&2
            exit 1
          fi
          if [[ "$count" == 1 ]]; then
            return
          fi

          echo "Uploading missing release asset ${name}"
          if ! gh release upload "$tag" "$path"; then
            # A concurrent retry may have uploaded the asset after the first
            # inspection. Never clobber it; re-inspect and verify it below.
            refresh_release
            if [[ "$(asset_count "$name")" != 1 ]]; then
              echo "Unable to upload required release asset ${name}" >&2
              exit 1
            fi
          fi
        }

        verify_metadata_asset() {
          local name=xtra-release-metadata.json
          local verification_dir
          refresh_release
          if [[ "$(asset_count "$name")" != 1 ]]; then
            echo "Release ${tag} is missing exactly one ${name} asset" >&2
            exit 1
          fi
          verification_dir="$(mktemp -d)"
          if ! gh release download "$tag" --pattern "$name" --dir "$verification_dir"; then
            echo "Unable to download ${name} for verification" >&2
            rm -rf "$verification_dir"
            exit 1
          fi
          if ! cmp -s "$metadata_asset" "$verification_dir/$name"; then
            echo "Release ${tag} contains unexpected ${name} contents" >&2
            rm -rf "$verification_dir"
            exit 1
          fi
          rm -rf "$verification_dir"
        }

        verify_apk_asset() {
          local name=app-release.apk
          local local_digest
          local remote_digest
          local verification_dir
          local downloaded_apk
          refresh_release
          if [[ "$(asset_count "$name")" != 1 ]]; then
            echo "Release ${tag} is missing exactly one ${name} asset" >&2
            exit 1
          fi

          local_digest="$(sha256sum "$apk_asset" | awk '{print $1}')"
          remote_digest="$(jq -r --arg name "$name" '[.assets[] | select(.name == $name)][0].digest // ""' <<< "$release_json")"
          if [[ "$remote_digest" == sha256:* ]]; then
            if [[ "$remote_digest" != "sha256:${local_digest}" ]]; then
              echo "Release ${tag} APK digest does not match the local APK" >&2
              exit 1
            fi
            return
          fi
          if [[ -n "$remote_digest" ]]; then
            echo "Release ${tag} exposes an unsupported APK digest: ${remote_digest}" >&2
            exit 1
          fi

          # Older GitHub API responses may omit digest. Download the existing
          # asset instead of replacing it, then compare its bytes locally.
          verification_dir="$(mktemp -d)"
          if ! gh release download "$tag" --pattern "$name" --dir "$verification_dir"; then
            echo "Unable to download ${name} for digest verification" >&2
            rm -rf "$verification_dir"
            exit 1
          fi
          downloaded_apk="$verification_dir/$name"
          if [[ ! -f "$downloaded_apk" ]] ||
            [[ "$(sha256sum "$downloaded_apk" | awk '{print $1}')" != "$local_digest" ]]; then
            echo "Release ${tag} APK bytes do not match the local APK" >&2
            rm -rf "$verification_dir"
            exit 1
          fi
          rm -rf "$verification_dir"
        }

        verify_release_postconditions() {
          verify_tag
          ensure_asset_present app-release.apk "$apk_asset"
          ensure_asset_present xtra-release-metadata.json "$metadata_asset"
          verify_tag
          verify_apk_asset
          verify_metadata_asset
        }

        existing_tag_sha="$(get_remote_tag_sha)"
        if [[ -z "$existing_tag_sha" ]]; then
          echo "Creating release tag ${tag} at ${GITHUB_SHA}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            local_tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "$local_tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Local release tag ${tag} points to ${local_tag_sha}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
          fi

          # Use RELEASE_TOKEN only for this tag mutation. This is deliberately
          # a non-forced push: an immutable tag must never be moved.
          auth_header="$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 | tr -d '\n')"
          if ! git -c "http.extraHeader=Authorization: Basic ${auth_header}" \
            push "$repository_url" "refs/tags/${tag}:refs/tags/${tag}"; then
            existing_tag_sha="$(get_remote_tag_sha)"
            if [[ "$existing_tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Unable to create release tag ${tag} at ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "A concurrent retry created ${tag} at ${GITHUB_SHA}; continuing"
          fi
        elif [[ "$existing_tag_sha" != "$GITHUB_SHA" ]]; then
          echo "Release tag ${tag} points to ${existing_tag_sha}, expected ${GITHUB_SHA}" >&2
          exit 1
        else
          echo "Release tag ${tag} already points to ${GITHUB_SHA}; continuing retry"
        fi

        if release_exists; then
          echo "Release ${tag} already exists; recovering and verifying it"
        else
          if ! gh release create "$tag" \
              --draft \
              --latest=false \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "Xtra ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes-file notes.txt \
              "$apk_asset" "$metadata_asset"; then
            if release_exists; then
              echo "Release ${tag} was created before the upload completed; recovering it"
            else
              echo "Unable to create immutable release ${tag}" >&2
              exit 1
            fi
          fi
        fi

        # Keep a release draft until both assets have been repaired and
        # verified. Published releases are immutable, so an unexpected asset
        # mismatch fails the workflow instead of being hidden by clobbering.
        verify_release_postconditions
        refresh_release
        if [[ "$(jq -r '.draft' <<< "$release_json")" == true ]]; then
          gh release edit "$tag" --draft=false --latest
        else
          gh release edit "$tag" --latest
        fi
        verify_release_postconditions
        refresh_release
        if [[ "$(jq -r '.draft' <<< "$release_json")" != false ]]; then
          echo "Release ${tag} was not published after verification" >&2
          exit 1
        fi

    # Keep the historical latest URL working for existing external instances.
    # The build tag above is the immutable release tag; only this compatibility
    # alias is moved, and its release is never deleted.
    - name: Update latest compatibility alias
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        VERSION: ${{ steps.version.outputs.name }}
      shell: bash
      run: |
        set -euo pipefail
        alias_tag=latest

        shopt -s nullglob
        assets=(app/build/outputs/apk/release/*.apk)
        if (( ${#assets[@]} == 0 )); then
          echo "No release APK was produced" >&2
          exit 1
        fi
        metadata_asset=xtra-release-metadata.json
        assets+=("$metadata_asset")

        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${alias_tag}" >/dev/null 2>&1; then
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${alias_tag}" \
            -f "sha=${GITHUB_SHA}" \
            -F force=true >/dev/null
        else
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${alias_tag}" \
            -f "sha=${GITHUB_SHA}" >/dev/null
        fi

        if gh release view "$alias_tag" >/dev/null 2>&1; then
          gh release upload "$alias_tag" --clobber "${assets[@]}"
          gh release edit "$alias_tag" \
            --title "Xtra ${VERSION} (build ${GITHUB_RUN_NUMBER}) [latest compatibility alias]" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest=false
        else
          gh release create "$alias_tag" \
            --verify-tag \
            --title "Xtra ${VERSION} (build ${GITHUB_RUN_NUMBER}) [latest compatibility alias]" \
            --notes-file notes.txt \
            --latest=false \
            "${assets[@]}"
        fi
