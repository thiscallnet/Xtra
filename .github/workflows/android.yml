name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  clip-instrumentation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        cache-provider: 'basic'
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run instrumentation tests
      uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
      with:
        api-level: 28
        target: google_apis
        arch: x86_64
        profile: pixel_2
        force-avd-creation: true
        disable-animations: true
        disable-linux-hw-accel: false
        script: |
          ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.github.andreyasadchy.xtra.ui.player.clip
          ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.github.andreyasadchy.xtra.repository.MetadataCacheTest
          ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.github.andreyasadchy.xtra.db.AppDatabaseMigrationTest
          ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.github.andreyasadchy.xtra.util.DatabaseRestoreRecoveryTest
          ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.github.andreyasadchy.xtra.repository.streamfeed.StreamFeedCacheTest
          ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.github.andreyasadchy.xtra.ui.view.CenteredImageSpanTest

  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - name: Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        cache-provider: 'basic'
    - name: Determine application version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        read -r version base_version_code <<< "$(./gradlew -q :app:printVersionInfo)"
        if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
          echo "Unexpected application version: $version" >&2
          exit 1
        fi
        if [[ ! "$base_version_code" =~ ^[0-9]+$ ]]; then
          echo "Unexpected versionCode base: $base_version_code" >&2
          exit 1
        fi

        version_code=$((base_version_code + GITHUB_RUN_NUMBER))
        if (( version_code <= base_version_code || version_code > 2100000000 )); then
          echo "Generated versionCode is outside the supported range: $version_code" >&2
          exit 1
        fi

        {
          echo "name=$version"
          echo "code=$version_code"
          echo "build=$GITHUB_RUN_NUMBER"
        } >> "$GITHUB_OUTPUT"
    - name: Write release metadata
      env:
        VERSION_NAME: ${{ steps.version.outputs.name }}
        VERSION_CODE: ${{ steps.version.outputs.code }}
        BUILD_NUMBER: ${{ steps.version.outputs.build }}
      shell: bash
      run: |
        set -euo pipefail
        jq -n \
          --arg version_name "$VERSION_NAME" \
          --argjson version_code "$VERSION_CODE" \
          --argjson build_number "$BUILD_NUMBER" \
          '{versionName: $version_name, versionCode: $version_code, buildNumber: $build_number}' \
          > xtra-release-metadata.json
    - name: Run JVM tests
      run: ./gradlew testDebugUnitTest

    - name: Check resource localization hygiene
      run: python3 .github/scripts/check-resources.py

    - name: Build with Gradle
      id: build
      env:
        TWITCH_PUBLIC_CLIENT_ID: ${{ vars.TWITCH_PUBLIC_CLIENT_ID }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${TWITCH_PUBLIC_CLIENT_ID:-}" ]]; then
          echo "Repository variable TWITCH_PUBLIC_CLIENT_ID is required for release builds" >&2
          exit 1
        fi
        build_args=(
          "-PciVersionCode=${{ steps.version.outputs.code }}"
          "-PtwitchPublicClientId=${TWITCH_PUBLIC_CLIENT_ID}"
        )
        # Release and perf share almost all sources. Build them in separate
        # Gradle invocations so Kotlin does not compile both variants at the
        # same time and exhaust the GitHub runner heap.
        # AGP's incremental universal-APK splitter can fail transiently after
        # a packaging worker is interrupted. Avoid reusing a partial
        # configuration-cache/package state and retry the complete variant
        # once; real compilation failures still fail the job.
        build_variant() {
          local task="$1"
          if ./gradlew --no-daemon --no-configuration-cache "$task" "${build_args[@]}"; then
            return 0
          fi
          echo "${task} failed; retrying once after stopping Gradle daemons" >&2
          ./gradlew --stop || true
          ./gradlew --no-daemon --no-configuration-cache "$task" "${build_args[@]}"
        }
        build_variant :app:assembleRelease
        build_variant :app:assemblePerf

    - name: Inspect release APKs
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        release_output_dir=app/build/outputs/apk/release
        if [[ ! -d "$release_output_dir" ]]; then
          echo "No release APK directory was produced"
          exit 0
        fi
        find "$release_output_dir" -maxdepth 1 -type f -name '*.apk' -print0 |
          xargs -0 -r ls -lh

    - name: Verify release metadata against APK
      id: verify-release-apk
      env:
        VERSION_NAME: ${{ steps.version.outputs.name }}
        VERSION_CODE: ${{ steps.version.outputs.code }}
      shell: bash
      run: |
        set -euo pipefail
        metadata_asset=xtra-release-metadata.json
        if [[ ! -f "$metadata_asset" ]]; then
          echo "Release metadata is missing: $metadata_asset" >&2
          exit 1
        fi

        metadata_version_name="$(jq -er '.versionName | strings' "$metadata_asset")"
        metadata_version_code="$(jq -er '.versionCode | numbers | tostring' "$metadata_asset")"
        if [[ "$metadata_version_name" != "$VERSION_NAME" || "$metadata_version_code" != "$VERSION_CODE" ]]; then
          echo "Release metadata does not match the CI version outputs" >&2
          exit 1
        fi

        release_output_dir=app/build/outputs/apk/release
        mapfile -t generated_apks < <(find "$release_output_dir" -maxdepth 1 -type f -name '*.apk' -print | sort)
        if (( ${#generated_apks[@]} != 5 )); then
          echo "Expected exactly five release APKs, found ${#generated_apks[@]}" >&2
          printf '%s\n' "${generated_apks[@]}" >&2
          exit 1
        fi

        aapt2="$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt2 -print | sort -V | tail -n1)"
        if [[ -z "$aapt2" ]]; then
          echo "Could not locate aapt2 to inspect release APKs" >&2
          exit 1
        fi
        apksigner="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
        if [[ -z "$apksigner" ]]; then
          echo "Could not locate apksigner to inspect release APK signatures" >&2
          exit 1
        fi

        native_abis() {
          unzip -Z1 "$1" |
            awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' |
            sort -u |
            paste -sd' ' -
        }

        declare -A apk_sources=()
        declare -A apk_sha256s=()
        expected_signer=""
        find_apk_for_abis() {
          local expected="$1"
          local matches=()
          local apk actual
          for apk in "${generated_apks[@]}"; do
            actual="$(native_abis "$apk")"
            if [[ "$actual" == "$expected" ]]; then
              matches+=("$apk")
            fi
          done
          if (( ${#matches[@]} != 1 )); then
            echo "Expected exactly one release APK with native ABIs [$expected], found ${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2
            exit 1
          fi
          printf '%s' "${matches[0]}"
        }

        verify_apk() {
          local apk_name="$1"
          local expected_abis="$2"
          local apk_asset="${apk_sources[$apk_name]}"
          local badging package_line apk_package_name apk_version_name apk_version_code
          badging="$($aapt2 dump badging "$apk_asset")"
          package_line="$(grep -m1 '^package: ' <<< "$badging" || true)"
          apk_package_name="$(sed -n "s/^package: name='\\([^']*\\)' .*/\\1/p" <<< "$package_line")"
          apk_version_code="$(sed -n "s/^package: name='[^']*' versionCode='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
          apk_version_name="$(sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
          if [[ "$apk_package_name" != "com.github.andreyasadchy.xtra" ||
                "$apk_version_name" != "$VERSION_NAME" ||
                "$apk_version_code" != "$VERSION_CODE" ]]; then
            echo "Built APK identity does not match expected release identity: $apk_name" >&2
            echo "APK: package=$apk_package_name versionName=$apk_version_name versionCode=$apk_version_code" >&2
            echo "Expected: package=com.github.andreyasadchy.xtra versionName=$VERSION_NAME versionCode=$VERSION_CODE" >&2
            exit 1
          fi

          local actual_abis
          actual_abis="$(native_abis "$apk_asset")"
          if [[ "$actual_abis" != "$expected_abis" ]]; then
            echo "$apk_name contains unexpected native ABIs: [$actual_abis], expected [$expected_abis]" >&2
            exit 1
          fi

          local apk_size max_apk_bytes min_apk_bytes apk_sha256 signer_digest
          apk_size="$(stat -c '%s' "$apk_asset")"
          min_apk_bytes=$((1024 * 1024))
          max_apk_bytes=$((300 * 1024 * 1024))
          if (( apk_size < min_apk_bytes || apk_size > max_apk_bytes )); then
            echo "$apk_name has an implausible size: ${apk_size} bytes" >&2
            exit 1
          fi
          apk_sha256="$(sha256sum "$apk_asset" | awk '{print $1}')"
          signer_digest="$("$apksigner" verify --print-certs "$apk_asset" 2>&1 |
            awk 'tolower($0) ~ /sha-256/ {
              value=$0
              sub(/^.*:[[:space:]]*/, "", value)
              gsub(/[[:space:]\r]/, "", value)
              print value
              exit
            }')"
          if [[ -z "$signer_digest" ]]; then
            echo "Could not determine signer for $apk_name" >&2
            exit 1
          fi
          if [[ -z "$expected_signer" ]]; then
            expected_signer="$signer_digest"
          elif [[ "$signer_digest" != "$expected_signer" ]]; then
            echo "$apk_name has a different signing certificate" >&2
            exit 1
          fi
          apk_sha256s["$apk_name"]="$apk_sha256"
          echo "Verified $apk_name package=$apk_package_name versionName=$apk_version_name versionCode=$apk_version_code nativeAbis=[$actual_abis] size=${apk_size} bytes sha256=${apk_sha256} signer=${signer_digest}"
        }

        declare -A expected_native_abis=(
          [app-release.apk]="arm64-v8a armeabi-v7a x86 x86_64"
          [app-arm64-v8a-release.apk]="arm64-v8a"
          [app-armeabi-v7a-release.apk]="armeabi-v7a"
          [app-x86-release.apk]="x86"
          [app-x86_64-release.apk]="x86_64"
        )
        release_apk_names=(
          app-release.apk
          app-arm64-v8a-release.apk
          app-armeabi-v7a-release.apk
          app-x86-release.apk
          app-x86_64-release.apk
        )
        for apk_name in "${release_apk_names[@]}"; do
          apk_sources["$apk_name"]="$(find_apk_for_abis "${expected_native_abis[$apk_name]}")"
          verify_apk "$apk_name" "${expected_native_abis[$apk_name]}"
        done

        artifacts_json="$(jq -cn \
          --arg universal_sha "${apk_sha256s[app-release.apk]}" \
          --arg arm64_sha "${apk_sha256s[app-arm64-v8a-release.apk]}" \
          --arg arm32_sha "${apk_sha256s[app-armeabi-v7a-release.apk]}" \
          --arg x86_sha "${apk_sha256s[app-x86-release.apk]}" \
          --arg x86_64_sha "${apk_sha256s[app-x86_64-release.apk]}" \
          '[
            {"abi":"universal","name":"app-release.apk","sha256":$universal_sha},
            {"abi":"arm64-v8a","name":"app-arm64-v8a-release.apk","sha256":$arm64_sha},
            {"abi":"armeabi-v7a","name":"app-armeabi-v7a-release.apk","sha256":$arm32_sha},
            {"abi":"x86","name":"app-x86-release.apk","sha256":$x86_sha},
            {"abi":"x86_64","name":"app-x86_64-release.apk","sha256":$x86_64_sha}
          ]')"
        metadata_tmp="$(mktemp)"
        jq \
          --arg sha256 "${apk_sha256s[app-release.apk]}" \
          --argjson artifacts "$artifacts_json" \
          '. + {sha256: $sha256, artifacts: $artifacts}' \
          "$metadata_asset" > "$metadata_tmp"
        mv "$metadata_tmp" "$metadata_asset"
        metadata_sha256="$(jq -er '.sha256 | strings' "$metadata_asset")"
        if [[ "$metadata_sha256" != "${apk_sha256s[app-release.apk]}" ]]; then
          echo "Release metadata SHA-256 does not match app-release.apk" >&2
          exit 1
        fi

        mkdir -p release-package
        find release-package -mindepth 1 -maxdepth 1 -type f -delete
        for apk_name in "${release_apk_names[@]}"; do
          cp "${apk_sources[$apk_name]}" "release-package/$apk_name"
        done
        cp "$metadata_asset" release-package/xtra-release-metadata.json

    - name: Upload a Build Artifact
      if: >-
        success() &&
        steps.build.outcome == 'success' &&
        steps.verify-release-apk.outcome == 'success' &&
        (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: xtra-${{ steps.version.outputs.name }}-build-${{ steps.version.outputs.code }}
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/perf/*.apk
        if-no-files-found: warn
        retention-days: 7

    - name: Upload release package
      if: >-
        success() &&
        steps.build.outcome == 'success' &&
        steps.verify-release-apk.outcome == 'success' &&
        ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
         (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: xtra-master-release-package
        path: release-package
        if-no-files-found: error
        retention-days: 14
