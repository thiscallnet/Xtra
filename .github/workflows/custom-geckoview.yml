            echo "toolchain_key=gecko-toolchains-${source_key}-${RUNNER_OS}-${RUNNER_ARCH}-rust-${GECKO_RUST_VERSION}-${TOOLCHAIN_CACHE_SCHEMA}"
            echo "fat_key=gecko-fat-${source_key}-${input_key}-${recipe_key}-${CACHE_SCHEMA}"
