name: Custom GeckoView

on:
  push:
    branches: [master]
    paths:
      - 'geckoview/**'
      - '.github/workflows/custom-geckoview.yml'
  pull_request:
    branches: [master, feature/geckoview-release-size]
    paths:
      - 'geckoview/**'
      - '.github/workflows/custom-geckoview.yml'
  workflow_dispatch:
    inputs:
      experiment:
        description: x86_64 GeckoView experiment
        required: true
        default: validate
        type: choice
        options:
          - validate
          - x86_64-auth
          - x86_64-nowebrtc
          - x86_64-nowebspeech
          - x86_64-minimal
          - x86_64-twitch-auth-radical-r1
      scope:
        description: Native build scope
        required: true
        default: none
        type: choice
        options:
          - none
          - smoke-arm64
          - release-both
          - r1-x86
          - r1-release
          - r1-preserve
      experimental_nowebrtc:
        description: Build the ARM64 no-WebRTC experiment
        required: false
        default: false
        type: boolean
      release_tag:
        description: Immutable release tag for safe or Twitch-auth R1 publication
        required: false
        default: ''
        type: string
      r1_source_run_id:
        description: Successful full R1 qualification run to promote without rebuilding Gecko
        required: false
        default: ''
        type: string
      r1_preserved_run_id:
        description: Preservation-only R1 artifact run to consume during promotion
        required: false
        default: ''
        type: string
      diagnostic_symbols:
        description: Force x86_64 Gecko rebuild and upload matching native symbols
        required: false
        default: false
        type: boolean
      preflight_only:
        description: Run radical configure/patch preflight without native compilation
        required: false
        default: false
        type: boolean
      symbolicate_run_id:
        description: Existing x86_64 diagnostic run to symbolicate without rebuilding
        required: false
        default: ''
        type: string
      symbolicate_crash_build_id:
        description: Build ID recorded by the tombstone being symbolicated
        required: false
        default: '06e2d8a2a68ceb2aa81a7e1e29c3aafe0bbe616e'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: custom-geckoview-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CACHE_SCHEMA: v3
  TOOLCHAIN_CACHE_SCHEMA: v4
  GECKO_RUST_VERSION: '1.97.1'

jobs:
  validate-recipe:
    name: Validate Gecko recipe
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.scope.outputs.run_heavy }}
      release_both: ${{ steps.scope.outputs.release_both }}
      r1_release: ${{ steps.scope.outputs.r1_release }}
      r1_x86: ${{ steps.scope.outputs.r1_x86 }}
      r1_promote: ${{ steps.scope.outputs.r1_promote }}
      r1_preserve: ${{ steps.scope.outputs.r1_preserve }}
      profile: ${{ steps.scope.outputs.profile }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate scripts and pinned recipe
        shell: bash
        run: |
          set -euo pipefail
          bash -n geckoview/scripts/*.sh
          python3 -m py_compile geckoview/scripts/*.py
          python3 geckoview/scripts/test-combine-r1-aar.py
          python3 geckoview/scripts/test-collect-r1-aars.py
          bash geckoview/scripts/test-r1-promotion-layout.sh
          bash geckoview/scripts/test-r1-release-provenance.sh
          bash geckoview/scripts/test-toolchain-cache.sh
          bash geckoview/scripts/test-x86-android-toolchain.sh
          python3 geckoview/scripts/validate-recipe.py
          rust_version_file="$(tr -d '\r\n' < geckoview/RUST_TOOLCHAIN_VERSION)"
          [[ "$rust_version_file" == "$GECKO_RUST_VERSION" ]] || {
            echo "Rust toolchain version mismatch: file=$rust_version_file workflow=$GECKO_RUST_VERSION" >&2
            exit 1
          }

      - name: Select native build scope
        id: scope
        shell: bash
        env:
          R1_SOURCE_RUN_ID: ${{ inputs.r1_source_run_id }}
        run: |
          set -euo pipefail
          r1_promote=false
          r1_preserve=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == push ]]; then
            run_heavy=false
            release_both=false
            r1_release=false
            r1_x86=false
            profile=safe
            matrix='{"include":[{"abi":"arm64-v8a","label":"ARM64"}]}'
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.scope }}" == r1-x86 ]]; then
            run_heavy=true
            release_both=false
            r1_release=false
            r1_x86=true
            profile=twitch-auth-radical-r1
            matrix='{"include":[{"abi":"x86","label":"x86"}]}'
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.experiment }}" != validate ]]; then
            run_heavy=false
            release_both=false
            r1_release=false
            r1_x86=false
            profile=safe
            matrix='{"include":[{"abi":"arm64-v8a","label":"ARM64"}]}'
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.scope }}" == smoke-arm64 ]]; then
            run_heavy=true
            release_both=false
            r1_release=false
            r1_x86=false
            profile=safe
            matrix='{"include":[{"abi":"arm64-v8a","label":"ARM64"}]}'
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.scope }}" == release-both ]]; then
            run_heavy=true
            release_both=true
            r1_release=false
            r1_x86=false
            profile=safe
            matrix='{"include":[{"abi":"arm64-v8a","label":"ARM64"},{"abi":"armeabi-v7a","label":"ARMv7"}]}'
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.scope }}" == r1-release ]]; then
            release_both=false
            r1_x86=false
            if [[ -n "$R1_SOURCE_RUN_ID" ]]; then
              run_heavy=false
              r1_release=false
              r1_promote=true
              profile=twitch-auth-radical-r1
              matrix='{"include":[]}'
            else
              run_heavy=true
              r1_release=true
              profile=twitch-auth-radical-r1
              matrix='{"include":[{"abi":"arm64-v8a","label":"ARM64"},{"abi":"armeabi-v7a","label":"ARMv7"},{"abi":"x86","label":"x86"},{"abi":"x86_64","label":"x86_64"}]}'
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.scope }}" == r1-preserve ]]; then
            [[ -n "$R1_SOURCE_RUN_ID" ]] || {
              echo 'r1_source_run_id is required for scope=r1-preserve' >&2
              exit 2
            }
            run_heavy=false
            release_both=false
            r1_release=false
            r1_x86=false
            r1_preserve=true
            profile=twitch-auth-radical-r1
            matrix='{"include":[]}'
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.experimental_nowebrtc }}" == true ]]; then
            run_heavy=true
            release_both=false
            r1_release=false
            r1_x86=false
            profile=safe
            matrix='{"include":[{"abi":"arm64-v8a","label":"ARM64"}]}'
          else
            run_heavy=false
            release_both=false
            r1_release=false
            r1_x86=false
            profile=safe
            matrix='{"include":[{"abi":"arm64-v8a","label":"ARM64"}]}'
          fi
          {
            echo "run_heavy=$run_heavy"
            echo "release_both=$release_both"
            echo "r1_release=$r1_release"
            echo "r1_x86=$r1_x86"
            echo "r1_promote=$r1_promote"
            echo "r1_preserve=$r1_preserve"
            echo "profile=$profile"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "native_build_scope=$matrix"

  symbolicate-existing-crash:
    name: Symbolicate existing x86_64 crash
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.symbolicate_run_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install symbolizer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes binutils llvm
          symbolizer="$(command -v llvm-symbolizer || find /usr/lib/llvm-*/bin -name llvm-symbolizer -print -quit)"
          test -x "$symbolizer"
          echo "LLVM_SYMBOLIZER=$symbolizer" >> "$GITHUB_ENV"
          "$symbolizer" --version | head -n 1

      - name: Download matching diagnostic symbols
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.symbolicate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "symbolicate_run_id must be numeric: $RUN_ID" >&2
            exit 2
          }
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name xtra-geckoview-x86_64-auth-symbols \
            --dir "$RUNNER_TEMP/symbol-input"

      - name: Verify Build ID and symbolicate known crash
        env:
          EXPECTED_BUILD_ID: ${{ inputs.symbolicate_crash_build_id }}
        shell: bash
        run: |
          set -euo pipefail
          symbol_dir="$RUNNER_TEMP/symbol-input/gecko-symbols"
          libxul="$symbol_dir/libxul.so"
          test -f "$libxul"
          actual_build_id="$(readelf -n "$libxul" | sed -n 's/^[[:space:]]*Build ID: //p' | head -n 1)"
          [[ "$EXPECTED_BUILD_ID" =~ ^[0-9a-f]{40}$ ]] || {
            echo "symbolicate_crash_build_id must be a 40-character hex Build ID" >&2
            exit 2
          }
          if [[ "$actual_build_id" != "$EXPECTED_BUILD_ID" ]]; then
            echo "Crash and symbol Build IDs differ; refusing to symbolicate" >&2
            echo "crash_build_id=$EXPECTED_BUILD_ID" >&2
            echo "symbols_build_id=$actual_build_id" >&2
            exit 1
          fi
          {
            echo "symbol_build_id=$actual_build_id"
            echo "crash_build_id=$EXPECTED_BUILD_ID"
            echo "source_run_id=${{ inputs.symbolicate_run_id }}"
            echo
            LLVM_SYMBOLIZER="$LLVM_SYMBOLIZER" \
              bash geckoview/scripts/symbolicate-android-crash.sh \
              "$libxul" geckoview/diagnostics/x86_64-auth-crash-pcs.txt
          } | tee "$RUNNER_TEMP/symbolicated-crash.txt"

      - name: Upload compact symbolication report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-x86_64-auth-symbolicated-crash
          retention-days: 1
          path: ${{ runner.temp }}/symbolicated-crash.txt
          if-no-files-found: warn

  prepare-toolchain:
    name: Prepare Gecko toolchain
    needs: validate-recipe
    if: ${{ needs.validate-recipe.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Gecko build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build patch sccache unzip

      - name: Compute cache keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          source_identity="$(python3 -c 'import json; l=json.load(open("geckoview/SOURCE_LOCK.json")); print(l["sourceGitRevision"]); print(l["archiveSha256"]); print(open("geckoview/SOURCE_REVISION").read().strip())')"
          source_key="$(printf '%s\n' "$source_identity" | sha256sum | awk '{print $1}')"
          {
            echo "toolchain_key=gecko-toolchains-${source_key}-${RUNNER_OS}-${RUNNER_ARCH}-rust-${GECKO_RUST_VERSION}-${TOOLCHAIN_CACHE_SCHEMA}"
            echo "source_cache_key=gecko-source-${source_key}-${CACHE_SCHEMA}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Gecko source snapshot
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.source_cache_key }}

      - name: Restore shared Mozilla toolchain state
        id: mozbuild-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.toolchain_key }}

      - name: Bootstrap Mozilla toolchain
        id: bootstrap
        if: steps.source-cache.outputs.cache-hit != 'true' || steps.mozbuild-cache.outputs.cache-hit != 'true'
        env:
          GECKO_BOOTSTRAP_ONLY: '1'
          GECKO_SOURCE_DIR: ${{ runner.temp }}/gecko-source
          GECKO_SOURCE_CACHE_DIR: ${{ runner.temp }}/gecko-source-snapshot
        run: ./geckoview/scripts/build-aar.sh arm64-v8a safe

      - name: Check Gecko source snapshot
        id: source-ready
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/gecko-source-snapshot/.xtra-source-snapshot.json" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Save Gecko source snapshot cache
        if: always() && steps.source-ready.outputs.ready == 'true' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.source_cache_key }}

      - name: Save shared Mozilla toolchain cache
        if: always() && steps.bootstrap.outcome == 'success' && steps.mozbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.toolchain_key }}

  build-skinny:
    name: ${{ matrix.label }} / ${{ needs.validate-recipe.outputs.profile }}
    needs: [validate-recipe, prepare-toolchain]
    if: ${{ needs.validate-recipe.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUILD_PROFILE: ${{ needs.validate-recipe.outputs.profile }}
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_GHA_VERSION: xtra-geckoview-v1-${{ matrix.abi }}-${{ needs.validate-recipe.outputs.profile }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.validate-recipe.outputs.matrix) }}
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Gecko build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils ninja-build patch unzip

      - name: Configure R1 build swap
        if: ${{ needs.validate-recipe.outputs.r1_release == 'true' || needs.validate-recipe.outputs.r1_x86 == 'true' }}
        shell: bash
        env:
          GECKO_SWAP_FILE: ${{ runner.temp }}/xtra-gecko-r1.swap
        run: |
          set -euo pipefail
          target_bytes=$((12 * 1024 * 1024 * 1024))
          current_bytes="$(free -b | awk '/^Swap:/ {print $2}')"
          if (( current_bytes < target_bytes )); then
            required_bytes=$((target_bytes - current_bytes))
            sudo fallocate -l "$required_bytes" "$GECKO_SWAP_FILE"
            sudo chmod 600 "$GECKO_SWAP_FILE"
            sudo mkswap "$GECKO_SWAP_FILE" >/dev/null
            sudo swapon "$GECKO_SWAP_FILE"
          fi
          free -h

      - name: Compute cache keys
        id: keys
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          profile="$BUILD_PROFILE"
          profile_file="geckoview/mozconfigs/${ABI}-${profile}.mozconfig"
          test -f "$profile_file"
          recipe_files=(
            geckoview/SOURCE_LOCK.json
            geckoview/COMPILE_RECIPE_VERSION
            geckoview/RUST_TOOLCHAIN_VERSION
            geckoview/mozconfigs/common.mozconfig
            "$profile_file"
            geckoview/patches/0001-disable-android-hls.patch
          )
          if [[ "$profile" == twitch-auth-radical-r1 ]]; then
            recipe_files+=(
              geckoview/mozconfigs/twitch-auth-radical-r1.mozconfig
              geckoview/patches/0002-exclude-webrtc-dependent-android-test.patch
              geckoview/patches/0003-twitch-auth-lite-build-cuts.patch
            )
          fi
          if [[ "$ABI" == x86 ]]; then
            recipe_files+=(
              geckoview/scripts/build-aar.sh
              geckoview/scripts/toolchain-cache.sh
              geckoview/scripts/verify-x86-config.py
            )
          fi
          source_identity="$(python3 -c 'import json; l=json.load(open("geckoview/SOURCE_LOCK.json")); print(l["sourceGitRevision"]); print(l["archiveSha256"]); print(open("geckoview/SOURCE_REVISION").read().strip())')"
          source_key="$(printf '%s\n' "$source_identity" | sha256sum | awk '{print $1}')"
          recipe_key="$(sha256sum "${recipe_files[@]}" | sha256sum | awk '{print $1}')"
          {
            echo "source_key=$source_key"
            echo "recipe_key=$recipe_key"
            echo "built_key=gecko-built-${source_key}-${ABI}-${profile}-${recipe_key}-${CACHE_SCHEMA}"
            echo "toolchain_key=gecko-toolchains-${source_key}-${RUNNER_OS}-${RUNNER_ARCH}-rust-${GECKO_RUST_VERSION}-${TOOLCHAIN_CACHE_SCHEMA}"
            echo "source_cache_key=gecko-source-${source_key}-${CACHE_SCHEMA}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Gecko source snapshot
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.source_cache_key }}

      - name: Restore shared Mozilla toolchain state
        id: mozbuild-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.toolchain_key }}

      - name: Use Mozilla sccache
        shell: bash
        run: |
          sccache_dir="$HOME/.mozbuild/sccache"
          if [[ ! -x "$sccache_dir/sccache" ]]; then
            echo "Mozilla sccache is missing: $sccache_dir/sccache" >&2
            exit 1
          fi
          if [[ "$BUILD_PROFILE" == twitch-auth-radical-r1 && "$GITHUB_REF" != refs/heads/master ]]; then
            local_bin="$RUNNER_TEMP/sccache-local-only-bin"
            mkdir -p "$local_bin"
            chmod +x "$GITHUB_WORKSPACE/geckoview/scripts/sccache-local-only.sh"
            ln -sf "$GITHUB_WORKSPACE/geckoview/scripts/sccache-local-only.sh" "$local_bin/sccache"
            echo "$local_bin" >> "$GITHUB_PATH"
            export PATH="$local_bin:$PATH"
            echo "SCCACHE_REAL_BINARY=$sccache_dir/sccache" >> "$GITHUB_ENV"
            echo 'SCCACHE_CACHE_SIZE=4G' >> "$GITHUB_ENV"
            export SCCACHE_REAL_BINARY="$sccache_dir/sccache"
            echo 'sccache_backend=local-only'
          else
            echo "$sccache_dir" >> "$GITHUB_PATH"
            export PATH="$sccache_dir:$PATH"
            echo 'sccache_backend=github-actions-cache'
          fi
          command -v sccache
          sccache --version

      - name: Configure sccache GitHub Actions cache
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Restore compiled Gecko output
        id: compiled-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gecko-built-cache
          key: ${{ steps.keys.outputs.built_key }}

      - name: Build and verify skinny GeckoView archive
        id: build
        env:
          GECKO_SKIP_BOOTSTRAP: '1'
          GECKO_SOURCE_DIR: ${{ runner.temp }}/gecko-source
          GECKO_SOURCE_CACHE_DIR: ${{ runner.temp }}/gecko-source-snapshot
          GECKO_COMPILED_CACHE_DIR: ${{ runner.temp }}/gecko-built-cache
          GECKO_BUILD_JOBS: ${{ (needs.validate-recipe.outputs.r1_release == 'true' || needs.validate-recipe.outputs.r1_x86 == 'true') && '1' || '2' }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./geckoview/scripts/build-aar.sh "${{ matrix.abi }}" "$BUILD_PROFILE" 2>&1 |
            tee "$RUNNER_TEMP/gecko-build.log"

      - name: Record sccache statistics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sccache --show-stats | tee "$RUNNER_TEMP/sccache-stats.txt"

      - name: Check Gecko source snapshot
        id: source-ready
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/gecko-source-snapshot/.xtra-source-snapshot.json" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Save Gecko source snapshot cache
        if: always() && steps.source-ready.outputs.ready == 'true' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.source_cache_key }}

      - name: Save shared Mozilla toolchain cache
        if: always() && steps.mozbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.toolchain_key }}

      - name: Save compiled Gecko output
        if: always() && steps.build.outcome == 'success' && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/gecko-built-cache
          key: ${{ steps.keys.outputs.built_key }}

      - name: Upload skinny Maven archive and provenance
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-${{ matrix.abi }}-${{ needs.validate-recipe.outputs.profile }}
          path: |
            geckoview/artifacts/*.aar
            geckoview/artifacts/*.target.maven.zip
            geckoview/artifacts/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload compact failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-${{ matrix.abi }}-failure-diagnostics
          path: |
            ${{ runner.temp }}/gecko-build.log
            ${{ runner.temp }}/gecko-source/config.log
            ${{ runner.temp }}/gecko-source/obj-xtra-*/config.log
            ${{ runner.temp }}/gecko-source/obj-xtra-*/config.status
            ${{ runner.temp }}/gecko-source/.mozconfig
            ${{ runner.temp }}/gecko-source/obj-xtra-*/config.status.json
            ${{ runner.temp }}/sccache-stats.txt
            geckoview/artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove R1 build swap
        if: ${{ always() && (needs.validate-recipe.outputs.r1_release == 'true' || needs.validate-recipe.outputs.r1_x86 == 'true') }}
        shell: bash
        env:
          GECKO_SWAP_FILE: ${{ runner.temp }}/xtra-gecko-r1.swap
        run: |
          set -euo pipefail
          if sudo swapon --show=NAME --noheadings | awk -v path="$GECKO_SWAP_FILE" '$1 == path { found = 1 } END { exit !found }'; then
            sudo swapoff "$GECKO_SWAP_FILE"
          fi
          sudo rm -f -- "$GECKO_SWAP_FILE"

  x86-experiment:
    name: x86_64 / ${{ inputs.experiment }}
    needs: validate-recipe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment != 'validate' && inputs.scope != 'r1-x86' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GECKO_EXPERIMENT: ${{ inputs.experiment }}
      GECKO_BUILD_JOBS: '1'
      # GitHub's cache service rejects sccache writes from PR/feature-branch
      # jobs. Disable that backend there; it otherwise turns every compile
      # into a doomed remote write attempt. The default branch may write.
      SCCACHE_LOG: debug
      GECKO_SWAP_GIB: '12'
      SCCACHE_CACHE_SIZE: 4G
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reclaim runner disk and report baseline
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf -- \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            timeout 30s docker system prune -af || true
          fi
          sudo apt-get clean
          echo 'Disk after cleanup:'
          df -h /
          du -sh "$RUNNER_TEMP"/* 2>/dev/null | sort -h || true

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Configure Gecko build swap
        shell: bash
        env:
          GECKO_SWAP_FILE: ${{ runner.temp }}/xtra-gecko.swap
        run: |
          set -euo pipefail
          target_bytes=$((GECKO_SWAP_GIB * 1024 * 1024 * 1024))
          current_bytes="$(free -b | awk '/^Swap:/ {print $2}')"
          echo "Configured swap bytes=$current_bytes target_bytes=$target_bytes"

          if (( current_bytes < target_bytes )); then
            required_bytes=$((target_bytes - current_bytes))
            if sudo swapon --show=NAME --noheadings | \
              awk -v path="$GECKO_SWAP_FILE" '$1 == path { found = 1 } END { exit !found }'; then
              sudo swapoff "$GECKO_SWAP_FILE"
            fi
            sudo rm -f -- "$GECKO_SWAP_FILE"
            sudo fallocate -l "$required_bytes" "$GECKO_SWAP_FILE"
            sudo chmod 600 "$GECKO_SWAP_FILE"
            sudo mkswap "$GECKO_SWAP_FILE" >/dev/null
            sudo swapon "$GECKO_SWAP_FILE"
          fi

          echo 'Swap after configuration:'
          free -h
          swapon --show

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Install Gecko build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes binutils ninja-build patch unzip

      - name: Select Gecko profile
        shell: bash
        run: |
          set -euo pipefail
          case "$GECKO_EXPERIMENT" in
            x86_64-auth|x86_64-nowebrtc|x86_64-nowebspeech|x86_64-minimal|x86_64-twitch-auth-radical-r1)
              echo "GECKO_PROFILE=${GECKO_EXPERIMENT#x86_64-}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported x86_64 experiment: $GECKO_EXPERIMENT" >&2
              exit 2
              ;;
          esac

      - name: Compute x86_64 cache keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          source_git_revision="$(python3 -c 'import json; print(json.load(open("geckoview/SOURCE_LOCK.json"))["sourceGitRevision"])')"
          source_archive_sha256="$(python3 -c 'import json; print(json.load(open("geckoview/SOURCE_LOCK.json"))["archiveSha256"])')"
          source_key="${source_git_revision}-${source_archive_sha256:0:16}"
          legacy_source_key=519aba0bfb421d93da6c236260d20707fb0ea04470c5178edf006b8820343269
          recipe_key="$(sha256sum \
            geckoview/SOURCE_LOCK.json \
            geckoview/COMPILE_RECIPE_VERSION \
            geckoview/RUST_TOOLCHAIN_VERSION \
            geckoview/mozconfigs/common.mozconfig \
            "geckoview/mozconfigs/x86_64-${GECKO_PROFILE}.mozconfig" \
            geckoview/patches/0001-disable-android-hls.patch \
            geckoview/patches/0002-exclude-webrtc-dependent-android-test.patch \
            geckoview/patches/0003-twitch-auth-lite-build-cuts.patch | \
            sha256sum | awk '{print $1}')"
          {
            echo "source_key=$source_key"
            echo "recipe_key=$recipe_key"
            echo "built_key=gecko-built-${source_key}-x86_64-${GECKO_PROFILE}-${recipe_key}-${CACHE_SCHEMA}"
            echo "toolchain_key=gecko-toolchains-${source_key}-${RUNNER_OS}-${RUNNER_ARCH}-rust-${GECKO_RUST_VERSION}-${TOOLCHAIN_CACHE_SCHEMA}"
            echo "source_cache_key=gecko-source-${source_key}-${CACHE_SCHEMA}"
            echo "legacy_toolchain_key=gecko-toolchains-${legacy_source_key}-${RUNNER_OS}-${RUNNER_ARCH}-rust-${GECKO_RUST_VERSION}-${TOOLCHAIN_CACHE_SCHEMA}"
            echo "legacy_source_cache_key=gecko-source-${legacy_source_key}-${CACHE_SCHEMA}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore pinned source archive cache
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # source-common.sh stores the compressed, verified archive here;
          # the expanded checkout remains disposable in RUNNER_TEMP.
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.source_cache_key }}

      - name: Restore legacy source archive cache
        id: source-cache-legacy
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.legacy_source_cache_key }}

      - name: Restore Mozilla toolchain cache
        id: mozbuild-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.toolchain_key }}

      - name: Restore legacy Mozilla toolchain cache
        id: mozbuild-cache-legacy
        if: steps.mozbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.legacy_toolchain_key }}

      - name: Report restored cache sizes
        shell: bash
        run: |
          set -euo pipefail
          echo "source_cache_hit=${{ steps.source-cache.outputs.cache-hit }}"
          echo "legacy_source_cache_hit=${{ steps.source-cache-legacy.outputs.cache-hit }}"
          echo "toolchain_cache_hit=${{ steps.mozbuild-cache.outputs.cache-hit }}"
          echo "legacy_toolchain_cache_hit=${{ steps.mozbuild-cache-legacy.outputs.cache-hit }}"
          df -h /
          du -sh "$RUNNER_TEMP"/* 2>/dev/null | sort -h || true
          du -sh "$HOME/.mozbuild" "$HOME/.cargo" "$HOME/.rustup" 2>/dev/null | sort -h || true

      - name: Select bootstrap mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.mozbuild-cache.outputs.cache-hit }}" == true || "${{ steps.mozbuild-cache-legacy.outputs.cache-hit }}" == true ]]; then
            echo 'GECKO_SKIP_BOOTSTRAP=1' >> "$GITHUB_ENV"
            echo 'Using restored Mozilla toolchain; build-aar.sh will skip bootstrap only when its completion marker is present.'
          else
            echo 'GECKO_SKIP_BOOTSTRAP=0' >> "$GITHUB_ENV"
            echo 'Mozilla toolchain cache missed; build-aar.sh will bootstrap once.'
          fi

      - name: Select diagnostic symbol mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.diagnostic_symbols }}" == true ]]; then
            echo 'GECKO_FORCE_REBUILD=1' >> "$GITHUB_ENV"
            echo "GECKO_SYMBOLS_DIR=$RUNNER_TEMP/gecko-symbols" >> "$GITHUB_ENV"
            echo 'Diagnostic symbols enabled: compiled Gecko artifact cache will be bypassed.'
          else
            echo 'GECKO_FORCE_REBUILD=0' >> "$GITHUB_ENV"
          fi

      - name: Use Mozilla sccache
        shell: bash
        run: |
          set -euo pipefail
          sccache_dir="$HOME/.mozbuild/sccache"
          if [[ ! -x "$sccache_dir/sccache" ]]; then
            echo "Mozilla sccache is missing: $sccache_dir/sccache" >&2
            exit 1
          fi
          # Ensure no server started by a different sccache binary survives.
          "$sccache_dir/sccache" --stop-server >/dev/null 2>&1 || true
          echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-error.log" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == 'refs/heads/master' ]]; then
            echo "$sccache_dir" >> "$GITHUB_PATH"
            echo "SCCACHE=$sccache_dir/sccache" >> "$GITHUB_ENV"
            export PATH="$sccache_dir:$PATH"
            echo 'sccache_backend=github-actions-cache'
          else
            local_bin="$RUNNER_TEMP/sccache-local-only-bin"
            mkdir -p "$local_bin"
            chmod +x "$GITHUB_WORKSPACE/geckoview/scripts/sccache-local-only.sh"
            ln -sf "$GITHUB_WORKSPACE/geckoview/scripts/sccache-local-only.sh" "$local_bin/sccache"
            echo "$local_bin" >> "$GITHUB_PATH"
            echo "SCCACHE=$local_bin/sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_REAL_BINARY=$sccache_dir/sccache" >> "$GITHUB_ENV"
            export PATH="$local_bin:$PATH"
            export SCCACHE_REAL_BINARY="$sccache_dir/sccache"
            echo 'sccache_backend=local-only'
          fi
          hash -r
          command -v sccache
          sccache --version
          echo "SCCACHE_GHA_ENABLED=${SCCACHE_GHA_ENABLED:-disabled}"
          echo "SCCACHE_GHA_RW_MODE=${SCCACHE_GHA_RW_MODE:-disabled}"

      - name: Configure sccache GitHub Actions cache
        if: github.ref == 'refs/heads/master'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_WRITE');
            core.exportVariable('SCCACHE_GHA_VERSION', 'xtra-geckoview-v1-x86_64-x86_64-auth');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Probe sccache backend
        if: inputs.experiment == 'x86_64-twitch-auth-radical-r1'
        shell: bash
        env:
          SCCACHE_LOG: debug
        run: |
          set -uo pipefail
          probe_dir="$RUNNER_TEMP/sccache-probe"
          mkdir -p "$probe_dir"
          printf 'int xtra_sccache_probe(void) { return 0; }\n' > "$probe_dir/probe.c"
          clang_bin="$HOME/.mozbuild/clang/bin/clang"
          if [[ ! -x "$clang_bin" ]]; then
            echo "sccache probe compiler missing: $clang_bin" >&2
            exit 1
          fi
          echo "sccache_probe_compiler=$clang_bin"
          echo "sccache_probe_environment:"
          env | sort | grep -E '^(ACTIONS_RESULTS_URL|SCCACHE|RUNNER_|GITHUB_EVENT_NAME|GITHUB_REF|GITHUB_SHA)' | sed 's/ACTIONS_RUNTIME_TOKEN=.*/ACTIONS_RUNTIME_TOKEN=***REDACTED***/'
          sccache --zero-stats >/dev/null 2>&1 || true
          set +e
          SCCACHE_LOG=debug sccache "$clang_bin" -c "$probe_dir/probe.c" -o "$probe_dir/probe.o" 2>&1 | tee "$RUNNER_TEMP/sccache-probe.log"
          probe_status=${PIPESTATUS[0]}
          set -e
          echo "sccache_probe_exit=$probe_status"
          sccache --show-stats 2>&1 | tee -a "$RUNNER_TEMP/sccache-probe.log" || true
          if [[ -s "${SCCACHE_ERROR_LOG:-}" ]]; then
            {
              echo 'sccache_error_log_excerpt_start'
              grep -m 40 -E 'ERROR|error|failed|HTTP|status|429|403|401|rate|cache' "$SCCACHE_ERROR_LOG" ||
                sed -n '1,80p' "$SCCACHE_ERROR_LOG"
              echo 'sccache_error_log_excerpt_end'
            } 2>&1 | tee -a "$RUNNER_TEMP/sccache-probe.log"
          else
            echo 'sccache_error_log=empty-or-missing' | tee -a "$RUNNER_TEMP/sccache-probe.log"
          fi
          if [[ "${SCCACHE_GHA_ENABLED:-}" == 'on' && -s "${SCCACHE_ERROR_LOG:-}" ]] &&
            grep -Eq 'storage write check failed|Cannot write to read-only storage|HTTP/[0-9.]+ 4(0[0-9]|22)' "$SCCACHE_ERROR_LOG"; then
            echo 'sccache GHA backend write probe failed permanently; refusing to start Gecko compilation' >&2
            exit 1
          fi
          exit "$probe_status"

      - name: Restore compiled x86_64 GeckoView artifacts
        id: compiled-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gecko-built-cache
          key: ${{ steps.keys.outputs.built_key }}

      - name: Preflight radical configure and patch application
        if: inputs.experiment == 'x86_64-twitch-auth-radical-r1' && (inputs.preflight_only == true || steps.compiled-cache.outputs.cache-hit != 'true')
        shell: bash
        env:
          GECKO_SOURCE_DIR: ${{ runner.temp }}/gecko-source
          GECKO_SOURCE_CACHE_DIR: ${{ runner.temp }}/gecko-source-snapshot
          GECKO_PREFLIGHT_ONLY: 1
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          ./geckoview/scripts/build-aar.sh x86_64 "$GECKO_PROFILE" 2>&1 | tee "$RUNNER_TEMP/gecko-preflight.log"

      - name: Build and verify x86_64 GeckoView AAR
        id: build
        if: inputs.preflight_only != true
        shell: bash
        env:
          GECKO_SOURCE_DIR: ${{ runner.temp }}/gecko-source
          GECKO_SOURCE_CACHE_DIR: ${{ runner.temp }}/gecko-source-snapshot
          GECKO_REUSE_SOURCE: 1
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          monitor_pid=''
          stop_monitor() {
            local pid="${monitor_pid:-}"
            monitor_pid=''
            if [[ -n "$pid" ]]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap stop_monitor EXIT
          trap 'exit 143' INT TERM

          resource_heartbeat() {
            echo '::group::Gecko resource heartbeat'
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            free -h
            df -h /
            ps -eo pid,comm,rss,%mem --sort=-rss | head -10 || true
            echo '::endgroup::'
          }

          resource_heartbeat
          (
            while sleep 300; do
              resource_heartbeat
            done
          ) &
          monitor_pid=$!
          echo "resource_heartbeat_pid=$monitor_pid interval_seconds=300"
          ./geckoview/scripts/build-aar.sh x86_64 "$GECKO_PROFILE" 2>&1 | tee "$RUNNER_TEMP/gecko-build.log"

      - name: Save compiled x86_64 GeckoView artifacts
        if: always() && steps.build.outcome == 'success' && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/gecko-built-cache
          key: ${{ steps.keys.outputs.built_key }}

      - name: Locate exact generated AAR
        id: artifact
        if: success() && inputs.preflight_only != true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aar_files < <(find geckoview/artifacts -maxdepth 1 -type f \
            -name "xtra-geckoview-x86_64-${GECKO_PROFILE}-*.aar" -print | sort)
          if [[ "${#aar_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one fresh x86_64 %s AAR, found %s:\n' \
              "$GECKO_EXPERIMENT" "${#aar_files[@]}" >&2
            printf '  %s\n' "${aar_files[@]}" >&2
            exit 1
          fi
          aar="$(realpath -- "${aar_files[0]}")"
          artifact_id="$(basename "$aar" .aar)"
          maven="${aar%.aar}.target.maven.zip"
          test -f "$maven"
          echo "aar_path=$aar" >> "$GITHUB_OUTPUT"
          echo "maven_path=$maven" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "Using exact generated AAR: $aar"
          echo "Using matching Maven archive: $maven"
          stat -c 'AAR compressed bytes=%s' "$aar"
          df -h /

      - name: Upload generated x86_64 GeckoView inputs
        if: always() && steps.artifact.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-${{ inputs.experiment }}-gecko-inputs
          retention-days: 1
          path: |
            ${{ steps.artifact.outputs.aar_path }}
            ${{ steps.artifact.outputs.maven_path }}
            geckoview/artifacts/${{ steps.artifact.outputs.artifact_id }}.json
          if-no-files-found: error

      - name: Upload x86_64 Gecko diagnostic symbols
        if: always() && inputs.diagnostic_symbols == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-${{ inputs.experiment }}-symbols
          retention-days: 1
          path: |
            ${{ runner.temp }}/gecko-symbols/**
            ${{ runner.temp }}/gecko-build.log
          if-no-files-found: warn

      - name: Build Xtra debug APK with exact AAR
        id: apk
        if: success() && inputs.preflight_only != true
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug \
            --max-workers=1 \
            "-PxtraGeckoViewAar=${{ steps.artifact.outputs.aar_path }}" 2>&1 | tee "$RUNNER_TEMP/xtra-debug-build.log"
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          stat -c 'Xtra debug APK bytes=%s' "$apk"
          echo 'Disk after Xtra debug APK package:'
          df -h /
          du -sh "$RUNNER_TEMP"/* 2>/dev/null | sort -h || true

      - name: Record x86_64 measurements
        if: success() && inputs.preflight_only != true
        shell: bash
        run: |
          set -euo pipefail
          ./geckoview/scripts/measure-artifacts.sh \
            "${{ steps.artifact.outputs.artifact_id }}" \
            "${{ steps.artifact.outputs.aar_path }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            not-tested \
            geckoview/artifacts/measurements.tsv
          echo 'Recorded measurements:'
          tail -n 3 geckoview/artifacts/measurements.tsv
          artifact_id="${{ steps.artifact.outputs.artifact_id }}"
          measurement_row="$(awk -F '\t' -v build="$artifact_id" \
            'NR == 1 || $1 == build { print }' geckoview/artifacts/measurements.tsv)"
          test -n "$measurement_row"
          {
            echo '## x86_64 GeckoView measurement'
            echo
            echo '```tsv'
            printf '%s\n' "$measurement_row"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record sccache statistics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sccache --show-stats | tee "$RUNNER_TEMP/sccache-stats.txt"

      - name: Report final disk usage
        if: always()
        shell: bash
        run: |
          echo 'Final disk usage:'
          df -h /
          du -sh "$RUNNER_TEMP"/* 2>/dev/null | sort -h || true
          du -sh "$HOME/.mozbuild" "$HOME/.cargo" "$HOME/.rustup" 2>/dev/null | sort -h || true

      - name: Check source archive cache
        id: source-ready
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/gecko-source-snapshot/.xtra-source-snapshot.json" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check Mozilla bootstrap marker
        id: bootstrap_marker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_git_revision="$(python3 - <<'PY'
          import json
          with open('geckoview/SOURCE_LOCK.json', encoding='utf-8') as source_lock:
              print(json.load(source_lock)['sourceGitRevision'])
          PY
          )"
          marker="$HOME/.mozbuild/.xtra-gecko-bootstrap-complete-${source_git_revision}"
          if [[ -f "$marker" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Mozilla bootstrap marker found: $marker"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Mozilla bootstrap marker not found: $marker"
          fi

      - name: Save pinned source archive cache
        if: always() && steps.source-ready.outputs.ready == 'true' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.source_cache_key }}

      - name: Save Mozilla toolchain cache
        if: always() && steps.bootstrap_marker.outputs.ready == 'true' && steps.mozbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.toolchain_key }}

      - name: Upload x86_64 experiment APK and measurements
        if: success() && inputs.preflight_only != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-${{ inputs.experiment }}-debug
          retention-days: 1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            geckoview/artifacts/measurements.tsv
          if-no-files-found: error

      - name: Upload compact x86_64 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-${{ inputs.experiment }}-failure-diagnostics
          retention-days: 1
          path: |
            ${{ runner.temp }}/gecko-build.log
            ${{ runner.temp }}/gecko-preflight.log
            ${{ runner.temp }}/xtra-debug-build.log
            ${{ runner.temp }}/sccache-probe.log
            ${{ runner.temp }}/sccache-error.log
            ${{ runner.temp }}/sccache-stats.txt
            ${{ runner.temp }}/gecko-source/.mozconfig
            ${{ runner.temp }}/gecko-source/obj-xtra-*/config.status.json
            geckoview/artifacts/*.json
          if-no-files-found: ignore

      - name: Remove temporary Gecko build swap
        if: always()
        shell: bash
        env:
          GECKO_SWAP_FILE: ${{ runner.temp }}/xtra-gecko.swap
        run: |
          set -euo pipefail
          if sudo swapon --show=NAME --noheadings | \
            awk -v path="$GECKO_SWAP_FILE" '$1 == path { found = 1 } END { exit !found }'; then
            sudo swapoff "$GECKO_SWAP_FILE"
          fi
          sudo rm -f -- "$GECKO_SWAP_FILE"
          echo 'Temporary Gecko swap removed.'
          free -h

  experimental-nowebrtc:
    name: ARM64 / nowebrtc (experimental)
    needs: [validate-recipe, prepare-toolchain]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_nowebrtc }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_GHA_VERSION: xtra-geckoview-v1-arm64-v8a-nowebrtc
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Gecko build tools
        run: sudo apt-get update && sudo apt-get install --yes binutils ninja-build patch unzip

      - name: Compute cache keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          source_identity="$(python3 -c 'import json; l=json.load(open("geckoview/SOURCE_LOCK.json")); print(l["sourceGitRevision"]); print(l["archiveSha256"]); print(open("geckoview/SOURCE_REVISION").read().strip())')"
          source_key="$(printf '%s\n' "$source_identity" | sha256sum | awk '{print $1}')"
          recipe_key="$(sha256sum geckoview/SOURCE_LOCK.json geckoview/COMPILE_RECIPE_VERSION \
            geckoview/RUST_TOOLCHAIN_VERSION \
            geckoview/mozconfigs/common.mozconfig geckoview/mozconfigs/arm64-v8a-nowebrtc.mozconfig \
            geckoview/patches/0001-disable-android-hls.patch | sha256sum | awk '{print $1}')"
          {
            echo "source_key=$source_key"
            echo "toolchain_key=gecko-toolchains-${source_key}-${RUNNER_OS}-${RUNNER_ARCH}-rust-${GECKO_RUST_VERSION}-${TOOLCHAIN_CACHE_SCHEMA}"
            echo "source_cache_key=gecko-source-${source_key}-${CACHE_SCHEMA}"
            echo "built_key=gecko-built-${source_key}-arm64-v8a-nowebrtc-${recipe_key}-${CACHE_SCHEMA}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Gecko source snapshot
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.source_cache_key }}

      - name: Restore shared Mozilla toolchain state
        id: mozbuild-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.toolchain_key }}

      - name: Use Mozilla sccache
        shell: bash
        run: |
          sccache_dir="$HOME/.mozbuild/sccache"
          if [[ ! -x "$sccache_dir/sccache" ]]; then
            echo "Mozilla sccache is missing: $sccache_dir/sccache" >&2
            exit 1
          fi
          echo "$sccache_dir" >> "$GITHUB_PATH"
          export PATH="$sccache_dir:$PATH"
          command -v sccache
          sccache --version

      - name: Configure sccache GitHub Actions cache
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Restore compiled Gecko output
        id: compiled-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gecko-built-cache
          key: ${{ steps.keys.outputs.built_key }}

      - name: Build and verify experimental archive
        id: build
        env:
          GECKO_SKIP_BOOTSTRAP: '1'
          GECKO_SOURCE_DIR: ${{ runner.temp }}/gecko-source
          GECKO_SOURCE_CACHE_DIR: ${{ runner.temp }}/gecko-source-snapshot
          GECKO_COMPILED_CACHE_DIR: ${{ runner.temp }}/gecko-built-cache
        run: ./geckoview/scripts/build-aar.sh arm64-v8a nowebrtc

      - name: Record sccache statistics
        if: always()
        continue-on-error: true
        shell: bash
        run: sccache --show-stats | tee "$RUNNER_TEMP/sccache-stats.txt"

      - name: Check Gecko source snapshot
        id: source-ready
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/gecko-source-snapshot/.xtra-source-snapshot.json" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Persist Gecko source snapshot
        if: always() && steps.source-ready.outputs.ready == 'true' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/gecko-source-snapshot
          key: ${{ steps.keys.outputs.source_cache_key }}

      - name: Persist toolchain state
        if: always() && steps.mozbuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.mozbuild
            ~/.cargo
            ~/.rustup
          key: ${{ steps.keys.outputs.toolchain_key }}

      - name: Persist compiled Gecko output
        if: always() && steps.build.outcome == 'success' && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/gecko-built-cache
          key: ${{ steps.keys.outputs.built_key }}

      - name: Upload experimental archive
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-arm64-v8a-nowebrtc
          path: |
            geckoview/artifacts/*.target.maven.zip
            geckoview/artifacts/*.json
          if-no-files-found: error
          retention-days: 7

  fat-aar:
