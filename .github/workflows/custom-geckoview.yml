  r1-integration:
    name: Xtra debug / ${{ matrix.abi }} / twitch-auth-radical-r1
    needs: [validate-recipe, build-skinny]
    if: ${{ needs.validate-recipe.outputs.r1_release == 'true' || needs.validate-recipe.outputs.r1_x86 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-recipe.outputs.matrix) }}
    env:
      R1_PROFILE: twitch-auth-radical-r1
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Install verification tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes binutils unzip jq

      - name: Download same-run R1 AAR
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: xtra-geckoview-${{ matrix.abi }}-${{ env.R1_PROFILE }}
          path: r1-inputs

      - name: Verify exact R1 AAR identity
        id: artifact
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mapfile -t aar_files < <(find r1-inputs -type f -name '*.aar' -print | sort)
          mapfile -t manifest_files < <(find r1-inputs -type f -name '*.json' -print | sort)
          [[ "${#aar_files[@]}" -eq 1 ]] || { echo "Expected exactly one R1 AAR" >&2; exit 1; }
          [[ "${#manifest_files[@]}" -ge 1 ]] || { echo "R1 AAR manifest is missing" >&2; exit 1; }
          aar="${aar_files[0]}"
          manifest="${manifest_files[0]}"
          profile="$(jq -er '.profile' "$manifest")"
          manifest_abi="$(jq -er '.abi' "$manifest")"
          source_revision="$(jq -er '.sourceRevision' "$manifest")"
          config_digest="$(jq -er '.configurationDigest' "$manifest")"
          [[ "$profile" == "$R1_PROFILE" && "$manifest_abi" == "$ABI" ]] || {
            echo "R1 identity mismatch: abi=$manifest_abi profile=$profile" >&2
            exit 1
          }
          expected_source_revision="$(jq -er '.revision' geckoview/SOURCE_LOCK.json)"
          [[ "$source_revision" == "$expected_source_revision" ]] || {
            echo "Gecko revision mismatch: $source_revision != $expected_source_revision" >&2
            exit 1
          }
          maven="${aar%.aar}.target.maven.zip"
          [[ -f "$maven" ]] || { echo "Matching Maven archive is missing: $maven" >&2; exit 1; }
          observed_manifest="$RUNNER_TEMP/r1-observed-aar-${ABI}.json"
          ./geckoview/scripts/verify-aar.sh "$aar" "$ABI" "$R1_PROFILE" \
            "$source_revision" "$config_digest" "$maven" "$manifest" "$observed_manifest"
          echo "aar=$aar" >> "$GITHUB_OUTPUT"
          echo "manifest=$observed_manifest" >> "$GITHUB_OUTPUT"
          echo "maven=$maven" >> "$GITHUB_OUTPUT"

      - name: Build Xtra debug APK with exact R1 AAR
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug --max-workers=1 \
            "-PxtraGeckoViewAar=${{ steps.artifact.outputs.aar }}"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          unzip -Z1 "$apk" | grep -qx "lib/${{ matrix.abi }}/libxul.so" || {
            echo "APK does not contain R1 libxul for ${{ matrix.abi }}" >&2
            exit 1
          }
          stat -c 'R1 integration APK bytes=%s' "$apk"

      - name: Create R1 ABI manifest
        env:
          ABI: ${{ matrix.abi }}
          GECKO_RECIPE_VERSION_FILE: geckoview/COMPILE_RECIPE_VERSION
        shell: bash
        run: |
          set -euo pipefail
          export GECKO_SOURCE_GIT_REVISION="$(jq -er '.sourceGitRevision' geckoview/SOURCE_LOCK.json)"
          python3 geckoview/scripts/create-r1-abi-manifest.py \
            "${{ steps.artifact.outputs.manifest }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            "$ABI" \
            "r1-abi-manifest.json"

      - name: Upload R1 ABI integration result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-${{ matrix.abi }}-twitch-auth-radical-r1-integration
          retention-days: 1
          path: |
            ${{ steps.artifact.outputs.aar }}
            ${{ steps.artifact.outputs.maven }}
            r1-abi-manifest.json
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  r1-universal:
    name: Qualify universal R1 GeckoView AAR
    needs: [validate-recipe, r1-integration]
    if: ${{ needs.validate-recipe.outputs.r1_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Download four ABI integrations
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: xtra-geckoview-*-twitch-auth-radical-r1-integration
          path: r1-inputs
          merge-multiple: false
      - name: Build and verify universal AAR
        id: universal
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aars < <(python3 geckoview/scripts/collect-r1-aars.py r1-inputs)
          [[ "${#aars[@]}" -eq 4 ]] || {
            echo "expected four verified R1 AARs, found ${#aars[@]}" >&2
            exit 1
          }
          mkdir -p universal
          ./geckoview/scripts/combine-r1-aar.sh universal/xtra-geckoview-twitch-auth-r1-universal.aar "${aars[@]}"
          ./geckoview/scripts/verify-fat-aar.sh universal/xtra-geckoview-twitch-auth-r1-universal.aar twitch-auth-radical-r1 unknown unknown arm64-v8a armeabi-v7a x86 x86_64
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          source = next(Path('r1-inputs').glob('*/r1-abi-manifest.json'))
          data = json.loads(source.read_text())
          aar = Path('universal/xtra-geckoview-twitch-auth-r1-universal.aar')
          out = {k: data[k] for k in ('profile', 'sourceRevision', 'sourceGitRevision', 'xtraCommit', 'compileRecipeVersion')}
          out['abis'] = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
          out['universal'] = {'file': aar.name, 'sha256': hashlib.sha256(aar.read_bytes()).hexdigest(), 'size': aar.stat().st_size}
          Path('universal/xtra-geckoview-twitch-auth-r1-universal.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          PY
      - name: Build Xtra against qualified universal AAR
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug --max-workers=1 -PxtraGeckoViewAar="$PWD/universal/xtra-geckoview-twitch-auth-r1-universal.aar"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -Z1 "$apk" | grep -qx "lib/$abi/libxul.so" || exit 1
          done
      - name: Upload qualified universal R1 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-twitch-auth-r1-universal
          path: |
            universal/*.aar
            universal/*.json
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  publish-r1:
    name: Publish immutable R1 ABI set
    needs: [validate-recipe, r1-integration, r1-universal]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && needs.validate-recipe.outputs.r1_release == 'true' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download R1 ABI integration results
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: xtra-geckoview-*-twitch-auth-radical-r1-integration
          path: r1-release-inputs
          merge-multiple: false
      - name: Download qualified universal R1 AAR
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: xtra-geckoview-twitch-auth-r1-universal
          path: r1-universal

      - name: Create immutable R1 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^geckoview-twitch-auth-r1-v[0-9]+(\.[0-9]+)*$ ]] || {
            echo "release_tag must match geckoview-twitch-auth-r1-vX[.Y...]" >&2
            exit 2
          }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists and is immutable: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists and is immutable: $RELEASE_TAG" >&2
            exit 1
          fi
          mkdir -p release-assets
          find_one() {
            local root="$1" name="$2" description="$3"
            mapfile -t matches < <(find "$root" -type f -name "$name" -print | sort)
            [[ "${#matches[@]}" -eq 1 ]] || {
              echo "expected exactly one $description; found ${#matches[@]}" >&2
              printf '  %s\n' "${matches[@]}" >&2
              exit 1
            }
            printf '%s\n' "${matches[0]}"
          }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            input_dir="$(find r1-release-inputs -type d -name "*-${abi}-twitch-auth-radical-r1-integration" -print -quit)"
            [[ -n "$input_dir" ]] || { echo "Missing integration result for $abi" >&2; exit 1; }
            manifest="$(find_one "$input_dir" r1-abi-manifest.json "$abi R1 ABI manifest")"
            aar_name="$(jq -er '.aar.file' "$manifest")"
            maven_name="$(jq -er '.maven.file' "$manifest")"
            aar="$(find_one "$input_dir" "$aar_name" "$abi AAR")"
            maven="$(find_one "$input_dir" "$maven_name" "$abi Maven archive")"
            [[ -f "$manifest" && -f "$aar" && -f "$maven" ]] || {
              echo "Incomplete R1 inputs for $abi" >&2
              exit 1
            }
            jq -e --arg abi "$abi" --arg commit "$GITHUB_SHA" \
              '.abi == $abi and .profile == "twitch-auth-radical-r1" and .xtraCommit == $commit' \
              "$manifest" >/dev/null || {
              echo "R1 manifest provenance mismatch for $abi" >&2
              exit 1
            }
            expected_manifest="$RUNNER_TEMP/expected-aar-$abi.json"
            observed_manifest="$RUNNER_TEMP/observed-aar-$abi.json"
            jq -n \
              --arg artifact "$(jq -er '.aar.file' "$manifest")" \
              --arg abi "$abi" \
              --arg profile "twitch-auth-radical-r1" \
              --arg source_revision "$(jq -er '.sourceRevision' "$manifest")" \
              --arg config_digest "$(jq -er '.configurationDigest' "$manifest")" \
              --arg sha256 "$(jq -er '.aar.sha256' "$manifest")" \
              --arg libxul_build_id "$(jq -er '.aar.libxulBuildId' "$manifest")" \
              --arg maven "$(jq -er '.maven.file' "$manifest")" \
              --arg maven_sha256 "$(jq -er '.maven.sha256' "$manifest")" \
              --argjson size "$(jq -er '.aar.size' "$manifest")" \
              --argjson libxul_size "$(jq -er '.aar.libxulSize' "$manifest")" \
              --argjson omni_size "$(jq -er '.aar.omniSize' "$manifest")" \
              '{artifact:$artifact,abi:$abi,profile:$profile,sourceRevision:$source_revision,
                configurationDigest:$config_digest,size:$size,sha256:$sha256,
                libxulSize:$libxul_size,libxulBuildId:$libxul_build_id,omniSize:$omni_size,
                mavenArchive:$maven,mavenArchiveSha256:$maven_sha256}' > "$expected_manifest"
            ./geckoview/scripts/verify-aar.sh "$aar" "$abi" twitch-auth-radical-r1 \
              "$(jq -er '.sourceRevision' "$manifest")" \
              "$(jq -er '.configurationDigest' "$manifest")" \
              "$maven" "$expected_manifest" "$observed_manifest"
            cp "$aar" "release-assets/xtra-geckoview-twitch-auth-r1-${abi}.aar"
            cp "$maven" "release-assets/xtra-geckoview-twitch-auth-r1-${abi}.target.maven.zip"
            cp "$manifest" "release-assets/xtra-geckoview-twitch-auth-r1-${abi}.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          assets = []
          for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64"):
              path = Path(f"release-assets/xtra-geckoview-twitch-auth-r1-{abi}.json")
              assets.append(json.loads(path.read_text(encoding="utf-8")))
          revisions = {item["sourceRevision"] for item in assets}
          git_revisions = {item["sourceGitRevision"] for item in assets}
          commits = {item["xtraCommit"] for item in assets}
          recipes = {item["compileRecipeVersion"] for item in assets}
          if not all(len(values) == 1 for values in (revisions, git_revisions, commits, recipes)):
              raise SystemExit("R1 ABI manifests do not share one build identity")
          aggregate = {
              "profile": "twitch-auth-radical-r1",
              "abis": [item["abi"] for item in assets],
              "sourceRevision": assets[0]["sourceRevision"],
              "sourceGitRevision": assets[0]["sourceGitRevision"],
              "xtraCommit": assets[0]["xtraCommit"],
              "compileRecipeVersion": assets[0]["compileRecipeVersion"],
              "artifacts": assets,
          }
          Path("release-assets/xtra-geckoview-twitch-auth-r1-manifest.json").write_text(
              json.dumps(aggregate, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          universal_aar="$(find r1-universal -type f -name '*.aar' -print -quit)"
          universal_manifest="$(find r1-universal -type f -name '*universal.json' -print -quit)"
          [[ -f "$universal_aar" && -f "$universal_manifest" ]] || { echo 'qualified universal R1 artifact is incomplete' >&2; exit 1; }
          cp "$universal_aar" release-assets/
          cp "$universal_manifest" release-assets/xtra-geckoview-twitch-auth-r1-universal.json
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "$RELEASE_TAG" \
            --notes "Immutable GeckoView R1 ABI set for Twitch authentication." \
            release-assets/*

  preserve-r1:
    name: Preserve qualified R1 artifacts
    needs: [validate-recipe]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate-recipe.outputs.r1_preserve == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install verification tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes binutils unzip jq
      - name: Download and verify qualified R1 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_TEMP: ${{ runner.temp }}
          R1_SOURCE_RUN_ID: ${{ inputs.r1_source_run_id }}
        shell: bash
        run: bash geckoview/scripts/preserve-r1-release.sh "$R1_SOURCE_RUN_ID"
      - name: Upload preserved ARM64 integration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-r1-preserved-arm64-v8a-integration
          path: r1-preserved/xtra-geckoview-r1-preserved-arm64-v8a-integration
          if-no-files-found: error
          retention-days: 90
      - name: Upload preserved ARMv7 integration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-r1-preserved-armeabi-v7a-integration
          path: r1-preserved/xtra-geckoview-r1-preserved-armeabi-v7a-integration
          if-no-files-found: error
          retention-days: 90
      - name: Upload preserved x86 integration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-r1-preserved-x86-integration
          path: r1-preserved/xtra-geckoview-r1-preserved-x86-integration
          if-no-files-found: error
          retention-days: 90
      - name: Upload preserved x86_64 integration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-r1-preserved-x86_64-integration
          path: r1-preserved/xtra-geckoview-r1-preserved-x86_64-integration
          if-no-files-found: error
          retention-days: 90
      - name: Upload preserved universal R1 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-geckoview-r1-preserved-universal
          path: r1-preserved/xtra-geckoview-r1-preserved-universal
          if-no-files-found: error
          retention-days: 90

  publish-r1-promoted:
    name: Promote immutable R1 ABI set
    needs: [validate-recipe]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && needs.validate-recipe.outputs.r1_promote == 'true' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Install verification tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes binutils unzip jq
      - name: Promote verified R1 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
          TWITCH_PUBLIC_CLIENT_ID: ${{ vars.TWITCH_PUBLIC_CLIENT_ID }}
          R1_SOURCE_RUN_ID: ${{ inputs.r1_source_run_id }}
          R1_PRESERVED_RUN_ID: ${{ inputs.r1_preserved_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: bash geckoview/scripts/promote-r1-release.sh "$R1_SOURCE_RUN_ID" "$RELEASE_TAG" "${R1_PRESERVED_RUN_ID:-$R1_SOURCE_RUN_ID}"

  integration:
    name: Xtra release with custom GeckoView
    needs: [validate-recipe, fat-aar]
    if: ${{ needs.validate-recipe.outputs.release_both == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Xtra configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Download universal AAR
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: xtra-geckoview-universal-safe
          path: geckoview/artifacts

      - name: Build arm64 release APK with custom GeckoView
        env:
          TWITCH_PUBLIC_CLIENT_ID: ${{ vars.TWITCH_PUBLIC_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TWITCH_PUBLIC_CLIENT_ID:-}" ]]; then
            echo "Repository variable TWITCH_PUBLIC_CLIENT_ID is required for release builds" >&2
            exit 1
          fi
          custom_aar="$(find geckoview/artifacts -maxdepth 1 -type f -name '*.aar' -print -quit)"
          [[ -n "$custom_aar" ]] || { echo "Universal custom GeckoView AAR is missing" >&2; exit 1; }
          ./gradlew assembleRelease \
            "-PxtraGeckoViewAar=$custom_aar" \
            -PxtraReleaseAbiSplits=true \
            "-PtwitchPublicClientId=${TWITCH_PUBLIC_CLIENT_ID}"
          apk="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -f "$apk"
          apk_size_bytes="$(stat -c '%s' "$apk")"
          max_apk_size_bytes=$((300 * 1024 * 1024))
          if (( apk_size_bytes > max_apk_size_bytes )); then
            echo "Custom-Gecko APK exceeds the 300 MiB regression guard: $apk_size_bytes bytes" >&2
            exit 1
          fi
          echo "Custom-Gecko APK size=$apk_size_bytes bytes"
          echo "Largest custom-Gecko APK members (uncompressed / compressed bytes):"
          unzip -lv "$apk" |
            awk 'NR > 3 && $1 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ { print $1 " / " $3 "  " $8 }' |
            sort -nr | sed -n '1,20p'

      - name: Upload integrated arm64 release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtra-custom-gecko-app-arm64-release
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish universal custom GeckoView
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.scope == 'release-both' && inputs.release_tag != '' }}
    needs: [validate-recipe, fat-aar, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download universal AAR
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: xtra-geckoview-universal-safe
          path: artifacts

      - name: Create immutable GeckoView release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^xtra-gv-[A-Za-z0-9._-]+$ ]]; then
            echo "release_tag must match xtra-gv-*" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Xtra GeckoView $tag" \
            --notes "Universal ARM custom GeckoView AAR for Xtra. The artifact includes its pinned source revision and SHA-256 manifest." \
            artifacts/*.aar artifacts/*.json
