fragment UserMessageClickedUser on User {
    bannerImageURL
    createdAt
    displayName
    followByLogin: follow(targetLogin: $targetLogin) @include(if: $useFollowLogin) {
        followedAt
    }
    followById: follow(targetID: $targetId) @skip(if: $useFollowLogin) {
        followedAt
    }
    lastBroadcast {
        startedAt
    }
    roles {
        isAffiliate
        isPartner
        isStaff
    }
    displayBadges(channelID: $targetId) {
        id
        setID
        version
        title
        description
        imageURL(size: QUADRUPLE)
    }
    relationship(targetUserID: $targetId) {
        subscriptionBenefit {
            id
        }
        subscriptionTenure(tenureMethod: CUMULATIVE) {
            months
        }
    }
    self {
        canFollow
        follower {
            followedAt
        }
    }
    id
    login
    profileImageURL(width: 300)
}

query UserMessageClicked($id: ID, $login: String, $targetId: ID, $userLogin: String!, $targetLogin: String!, $useFollowLogin: Boolean!) {
    user(id: $id, login: $login, lookupType: ALL) {
        ...UserMessageClickedUser
    }
    channelViewer(userLogin: $userLogin, channelLogin: $targetLogin) {
        id
        earnedBadges {
            id
            setID
            version
            title
            description
            imageURL(size: QUADRUPLE)
        }
    }
}

query UserMessageClickedBasic($id: ID, $login: String, $targetId: ID, $targetLogin: String, $useFollowLogin: Boolean!) {
    user(id: $id, login: $login, lookupType: ALL) {
        ...UserMessageClickedUser
    }
}
