query UserFollowedStreams($first: Int, $after: Cursor, $sort: StreamSort) {
    user {
        followedLiveUsers(first: $first, after: $after, sort: $sort) {
            edges {
                cursor
                node {
                    displayName
                    id
                    login
                    profileImageURL(width: 300)
                    self {
                        follower {
                            notificationSettings {
                                isEnabled
                            }
                        }
                    }
                    stream {
                        broadcaster {
                            broadcastSettings {
                                title
                            }
                        }
                        createdAt
                        freeformTags {
                            name
                        }
                        game {
                            displayName
                            id
                            slug
                        }
                        id
                        previewImageURL
                        viewersCount
                    }
                }
            }
            pageInfo {
                hasNextPage
            }
        }
    }
}
